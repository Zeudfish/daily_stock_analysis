name: A-share dual project review

on:
  schedule:
    # 18:20 Beijing time, weekdays. Vibe resolves the actual completed A-share date.
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trade date YYYY-MM-DD (blank = latest completed trading day)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: a-share-dual-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Shanghai
      TRADE_DATE: ${{ inputs.trade_date || '' }}
      REVIEW_TO: zeurdfish@gmail.com
      REVIEW_FROM: ${{ secrets.GMAIL_SENDER || 'zeurdfish@gmail.com' }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DSA_MODELFLARE_KEY: ${{ secrets.MODELFLARE_KEY }}
      DSA_AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
      DSA_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DSA_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DSA_OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      DSA_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      DSA_TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      VIBE_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout integration scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Restore Vibe AStock history
        uses: actions/cache@v4
        with:
          path: .cache/vibe-local
          key: vibe-local-${{ github.run_id }}
          restore-keys: |
            vibe-local-

      - name: Run both upstream projects and send source reports
        run: python scripts/run_dual_review.py

      - name: Upload raw reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-review-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
